    <nav>
      <a href="index.html" class="back-a">← BACK</a>
      <p class="overmind"> <span class="over">OVER</span><span class="mind">Mind</span></p>

      <p>TOPIC</p>
    </nav>

    <div class="topic-div">

      <div class="topic-section">
      <div class="topic-details">
        <div class="topic-step">
          <div class="line"></div>
          <p class="topic-p1">STEP 02</p>
          <p class="dash"></p>
          <p class="topic-name"></p>
        </div>

        <h1>YOUR CHALLENGE.</h1>

        <div class="topic-box">

          <p class="topic-info">LOADING....</p>
        </div>
        
      </div>

      <div class="response">
        <p>YOUR RESPONSE</p>

        <textarea placeholder="Write out your thinking. Don't hold back - the AI reads your reasoning, not just your answer"  class="user-response" name="user-response" id="response"></textarea>
      </div>

      <p class="error"></p>

      <div class="buttons">
        <button class="submit">SUBMIT ANSWER →</button>
        <a class="back" href="topics.html">← BACK</a>
      </div>

      <div class="ai-response">
        <div class="ai-head">
          <div class="line"></div>
          <p>AI ANALYSIS</p>
        </div>

        <div class="score">
          <p class="feedback">FEEDBACK.</p>

          <p> <span class="ai-score"></span>
          <span class="hunnid">/100</span>
        </p>
         
        </div>

        <div class="ai-analysis">
          <p class="ai-p">OVERMIND ANALYSIS</p>
          <div class="what-worked">
            <p class="what-worked-p">WHAT WORKED</p>

            <p class="ai-response-1">

            </p>
          </div>

          <div class="ai-line"></div>

          <div class="need-work">
            <p class="need-work-p">WHAT NEEDS WORK</p>

            <p class="ai-response-2">
              FAILED
            </p>
          </div>


          <div class="ai-line"></div>

          <div class="stronger-move">
            <p class="stronger-move-p">STRONGER MOVE</p>

            <p class="ai-response-3">

            </p>
          </div>
        </div>

        <a class="try-another" href="topics.html">TRY ANOTHER CHALLENGE →</a>

      </div>
      </div>
    </div>
